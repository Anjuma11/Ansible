- name: creating ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    instances:
    - mysql
    - frontend
    - backend
    sg_id: sg-0f68753c425461a57
    subnet_id: subnet-0e0f4f3d041b35212
    zone: anjuma.shop
  tasks:
  - name: create ec2
    amazon.aws.ec2_instance:
      name: "{{item}}"
      vpc_subnet_id: "{{subnet_id}}"
      instance_type: t3.micro
      security_group: "{{sg_id}}"
      image_id: ami-0220d79f3f480ecf5

      tags:
       name: "{{ item }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print ec2_output
    ansible.builtin.debug:
      msg: "{{ec2_output}}"

  - name: create r53
    amazon.aws.route53:
      state: present
      zone: "{{zone}}"
      record: "{{item.item}}.{{zone}}" # 1st item is iterative, 2nd item is present in ansible_gather_facts
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}"
      wait: true
      overwrite: true
    loop: "{{ec2_output.results}}"

  - name: create r53
    amazon.aws.route53:
      state: present
      zone: "{{zone}}"
      record: "{{zone}}"
      type: A
      ttl: 1
      value: "{{item.instances[0].public_ip_address}}"
      wait: true
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: item.item == "frontend"